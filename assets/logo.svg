<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Brain network nodes -->
  <circle cx="60" cy="70" r="18" fill="#4ecdc4" opacity="0.9"/>
  <circle cx="140" cy="70" r="18" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="100" cy="140" r="18" fill="#ffe66d" opacity="0.9"/>
  
  <!-- Connection lines (P2P) -->
  <line x1="60" y1="70" x2="140" y2="70" stroke="#4ecdc4" stroke-width="3" opacity="0.6"/>
  <line x1="60" y1="70" x2="100" y2="140" stroke="#4ecdc4" stroke-width="3" opacity="0.6"/>
  <line x1="140" y1="70" x2="100" y2="140" stroke="#ff6b6b" stroke-width="3" opacity="0.6"/>
  
  <!-- Pulsing dots on connections -->
  <circle cx="100" cy="70" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="105" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="105" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bug emoji on center node -->
  <text x="100" y="148" text-anchor="middle" font-size="22" fill="#333">🐛</text>
  
  <!-- Node labels -->
  <text x="60" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#4ecdc4">Bug</text>
  <text x="140" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6b6b">Pinky</text>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
</svg>